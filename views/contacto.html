<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | GameCollection</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="site-header">
    <a class="logo" href="/">🎮 GameCollection</a>
    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="/">Inicio</a></li>
        <li><a href="/login">Iniciar sesión</a></li>
        <li><a href="/contacto" aria-current="page">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main id="contenido">
    <section class="form-box">
      <h1>Contacto</h1>
      <form id="contact-form" novalidate>
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn">Enviar mensaje</button>
      </form>
      <p id="form-message" class="message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 GameCollection · Proyecto académico CESUR</p>
  </footer>
</body>
</html>
